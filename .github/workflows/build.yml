name: Build IPTV PLAYER

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      # Samsung Tizen folder (dist + config.xml) — download it from the run's "Artifacts"
      - run: |
          mkdir -p samsung-tizen
          cp -r dist/* samsung-tizen/
          cp platforms/tizen/config.xml samsung-tizen/
      - uses: actions/upload-artifact@v4
        with:
          name: iptv-player-samsung-tizen
          path: samsung-tizen
      # LG webOS folder
      - run: |
          mkdir -p lg-webos
          cp -r dist/* lg-webos/
          cp platforms/webos/appinfo.json lg-webos/
      - uses: actions/upload-artifact@v4
        with:
          name: iptv-player-lg-webos
          path: lg-webos
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
