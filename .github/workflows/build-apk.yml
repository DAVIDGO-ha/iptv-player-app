name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source
        run: unzip -o app-source.zip -d src
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install deps
        run: |
          cd src/IPTV-PLAYER
          npm install
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6
      - name: Build web
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: cd src/IPTV-PLAYER && npm run build
      - name: Add Android platform
        run: cd src/IPTV-PLAYER && npx cap add android && npx cap sync android
      - name: Android TV / Firestick support + http streams
        run: |
          cd src/IPTV-PLAYER
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<application android:usesCleartextTraffic="true" android:banner="@drawable/banner"|' $M
          sed -i 's|<category android:name="android.intent.category.LAUNCHER" />|<category android:name="android.intent.category.LAUNCHER" />\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />|' $M
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n    <uses-feature android:name="android.software.leanback" android:required="false" />|' $M
          mkdir -p android/app/src/main/res/drawable
          if [ -f platforms/android/banner.png ]; then cp platforms/android/banner.png android/app/src/main/res/drawable/banner.png; else sed -i 's| android:banner="@drawable/banner"||' $M; fi
          cat $M
      - name: Build APK
        run: cd src/IPTV-PLAYER/android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp src/IPTV-PLAYER/android/app/build/outputs/apk/debug/app-debug.apk IPTV-PLAYER.apk
      - uses: actions/upload-artifact@v4
        with:
          name: iptv-player-apk
          path: IPTV-PLAYER.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest IPTV-PLAYER.apk -t "IPTV PLAYER APK" -n "Install IPTV-PLAYER.apk on your Android phone, Android TV or Firestick."
